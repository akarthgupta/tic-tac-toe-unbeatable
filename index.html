<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unbeatable Tic-Tac-Toe</title>
<style>
  :root {
    --bg: #0b1220;
    --panel: #1e293b;
    --panel-hi: #263449;
    --line: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --x: #38bdf8;
    --o: #fb7185;
    --win: #34d399;
    --radius: 14px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: radial-gradient(circle at 50% 0%, #16233c 0%, var(--bg) 60%);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  main {
    width: 100%;
    max-width: 420px;
    text-align: center;
  }

  h1 {
    margin: 0 0 4px;
    font-size: 1.5rem;
    font-weight: 650;
    letter-spacing: -0.01em;
  }

  .tagline {
    margin: 0 0 22px;
    font-size: 0.82rem;
    color: var(--muted);
  }

  .badge {
    display: inline-block;
    margin-left: 6px;
    padding: 2px 8px;
    border: 1px solid var(--line);
    border-radius: 999px;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--win);
    vertical-align: 1px;
  }

  /* ---- scoreboard ---- */

  .scores {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 18px;
  }

  .score {
    padding: 10px 6px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
  }

  .score dt {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
  }

  .score dd {
    margin: 4px 0 0;
    font-size: 1.35rem;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
  }

  #score-wins   { color: var(--x); }
  #score-draws  { color: var(--muted); }
  #score-losses { color: var(--o); }

  /* ---- board ---- */

  #board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 18px;
  }

  .cell {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    font: inherit;
    font-size: clamp(2.2rem, 12vw, 3rem);
    font-weight: 700;
    line-height: 1;
    color: var(--text);
    background: var(--panel);
    border: 2px solid var(--line);
    border-radius: var(--radius);
    cursor: pointer;
    transition: background 140ms ease, border-color 140ms ease,
                transform 140ms ease, box-shadow 140ms ease;
  }

  .cell[data-mark=""]:not(:disabled):hover {
    background: var(--panel-hi);
    border-color: #475569;
    transform: translateY(-2px);
  }

  .cell[data-mark=""]:not(:disabled):active { transform: translateY(0) scale(0.98); }

  .cell[data-mark="X"] { color: var(--x); border-color: rgba(56, 189, 248, 0.45); }
  .cell[data-mark="O"] { color: var(--o); border-color: rgba(251, 113, 133, 0.45); }

  .cell:disabled { cursor: default; }
  .cell.thinking { opacity: 0.55; }

  .cell:focus-visible {
    outline: 2px solid var(--x);
    outline-offset: 3px;
  }

  .cell.win {
    border-color: var(--win);
    background: rgba(52, 211, 153, 0.14);
    animation: win-pulse 1.1s ease-in-out infinite;
  }

  @keyframes win-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
    50%      { box-shadow: 0 0 0 7px rgba(52, 211, 153, 0.18); }
  }

  .cell.pop { animation: pop 180ms ease-out; }

  @keyframes pop {
    from { transform: scale(0.4); opacity: 0; }
    to   { transform: scale(1);   opacity: 1; }
  }

  #board.draw { animation: draw-flash 700ms ease-in-out 2; }

  @keyframes draw-flash {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.55; }
  }

  /* ---- status + controls ---- */

  #status {
    min-height: 1.4em;
    margin: 0 0 18px;
    font-size: 0.92rem;
    color: var(--muted);
    transition: color 140ms ease;
  }

  #status[data-tone="win"]  { color: var(--x); }
  #status[data-tone="lose"] { color: var(--o); }
  #status[data-tone="draw"] { color: var(--win); }

  .controls {
    display: flex;
    gap: 10px;
    justify-content: center;
    align-items: center;
  }

  button.primary {
    padding: 10px 22px;
    font: inherit;
    font-weight: 600;
    color: var(--bg);
    background: var(--x);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: filter 140ms ease, transform 140ms ease;
  }

  button.primary:hover  { filter: brightness(1.1); }
  button.primary:active { transform: scale(0.97); }

  button.link {
    padding: 10px 6px;
    font: inherit;
    font-size: 0.82rem;
    color: var(--muted);
    background: none;
    border: none;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  button.link:hover { color: var(--text); }

  button:focus-visible { outline: 2px solid var(--x); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<main>
  <h1>Unbeatable Tic-Tac-Toe<span class="badge">Impossible</span></h1>
  <p class="tagline">You are X and move first. The AI solves the whole game tree — the best you can get is a draw.</p>

  <dl class="scores">
    <div class="score"><dt>You</dt><dd id="score-wins">0</dd></div>
    <div class="score"><dt>Draws</dt><dd id="score-draws">0</dd></div>
    <div class="score"><dt>AI</dt><dd id="score-losses">0</dd></div>
  </dl>

  <div id="board">
    <button class="cell" data-mark="" aria-label="Top left"></button>
    <button class="cell" data-mark="" aria-label="Top middle"></button>
    <button class="cell" data-mark="" aria-label="Top right"></button>
    <button class="cell" data-mark="" aria-label="Middle left"></button>
    <button class="cell" data-mark="" aria-label="Center"></button>
    <button class="cell" data-mark="" aria-label="Middle right"></button>
    <button class="cell" data-mark="" aria-label="Bottom left"></button>
    <button class="cell" data-mark="" aria-label="Bottom middle"></button>
    <button class="cell" data-mark="" aria-label="Bottom right"></button>
  </div>

  <p id="status" role="status" aria-live="polite"></p>

  <div class="controls">
    <button class="primary" id="new-game">New game</button>
    <button class="link" id="reset-scores">Reset scores</button>
  </div>
</main>

<!-- Classic script, deliberately not type="module": modules fail CORS on file:// URLs,
     so the page would break when opened by double-click. -->
<script src="game.js" defer></script>
</body>
</html>
